<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>居家训练 - 界面预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #FAF8F5;
    --card:      #FFFFFF;
    --text:      #3D3929;
    --text2:     #8B866E;
    --accent:    #7DA97C;
    --accent-warm: #D4A76A;
    --accent-soft: #C9D5C4;
    --danger:    #D4706A;
    --border:    #E8E4DB;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(61,57,41,0.06);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #E8E4DB;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    min-height: 100vh;
  }

  /* Phone frame */
  .phone {
    width: 390px;
    min-height: 844px;
    background: var(--bg);
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 2px #333;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 28px 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  /* Screen container */
  .screen {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 100px;
    scroll-behavior: smooth;
  }

  .screen-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    font-family: Georgia, "Songti SC", "Noto Serif SC", serif;
    margin-bottom: 4px;
  }
  .screen-subtitle {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 20px;
  }

  /* Section */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 24px 0 12px;
  }
  .section-header h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    font-family: Georgia, "Songti SC", serif;
  }
  .section-header span {
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
  }

  /* Cards */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  /* Today summary card */
  .today-card {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 20px;
    border-radius: var(--radius);
    margin-bottom: 16px;
    box-shadow: 0 4px 12px rgba(125,169,124,0.25);
  }
  .today-card .day-label {
    font-size: 12px;
    opacity: 0.85;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .today-card .day-title {
    font-size: 22px;
    font-weight: 700;
    font-family: Georgia, "Songti SC", serif;
    margin-bottom: 2px;
  }
  .today-card .day-theme {
    font-size: 13px;
    opacity: 0.9;
    margin-bottom: 12px;
  }
  .today-card .stats-row {
    display: flex;
    gap: 16px;
    font-size: 12px;
    opacity: 0.85;
  }
  .today-card .stats-row strong { font-size: 15px; font-weight: 600; }

  /* Exercise card */
  .exercise-card {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .exercise-illustration {
    width: 72px;
    height: 72px;
    background: var(--accent-soft);
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .exercise-illustration svg {
    width: 64px;
    height: 64px;
  }
  .exercise-info { flex: 1; min-width: 0; }
  .exercise-info .ex-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 3px;
  }
  .exercise-info .ex-meta {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.5;
  }
  .exercise-info .ex-meta span {
    display: inline-block;
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 6px;
    margin-right: 4px;
    margin-bottom: 3px;
    font-size: 11px;
    font-family: "SF Mono", "Menlo", monospace;
  }
  .timer-badge {
    background: var(--accent-warm);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 20px;
    white-space: nowrap;
    cursor: pointer;
    border: none;
    font-family: -apple-system, sans-serif;
  }

  /* Diet card */
  .meal-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .meal-row:last-child { border-bottom: none; }
  .meal-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .meal-icon.breakfast { background: #FFF3E0; }
  .meal-icon.lunch { background: #E8F5E9; }
  .meal-icon.dinner { background: #F3E5F5; }
  .meal-icon.snack { background: #FFF8E1; }
  .meal-detail { flex: 1; }
  .meal-detail .meal-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .meal-detail .meal-food { font-size: 12px; color: var(--text2); margin-top: 2px; line-height: 1.4; }
  .meal-detail .meal-kcal { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* Info chips */
  .info-chips {
    display: flex;
    gap: 10px;
    margin: 12px 0;
    flex-wrap: wrap;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
    flex: 1;
    min-width: 0;
  }
  .chip .chip-icon { font-size: 18px; flex-shrink: 0; }
  .chip .chip-val { font-weight: 700; font-size: 15px; }
  .chip .chip-label { font-size: 10px; color: var(--text2); }

  /* Water progress */
  .water-bar {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    margin-top: 8px;
    overflow: hidden;
  }
  .water-bar .fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.3s;
  }

  /* Bottom nav */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 22px;
    z-index: 10;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    color: var(--text2);
    cursor: pointer;
    border: none;
    background: none;
    font-family: -apple-system, sans-serif;
  }
  .nav-item.active { color: var(--accent); font-weight: 600; }
  .nav-item .nav-icon { font-size: 20px; }

  /* Section divider */
  .divider {
    text-align: center;
    padding: 28px 0 12px;
    font-size: 13px;
    color: var(--text2);
    font-family: Georgia, "Songti SC", serif;
    letter-spacing: 1px;
  }

  /* Screen Navigation */
  .screen-nav {
    display: flex;
    gap: 8px;
    margin: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .screen-nav button {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    font-family: -apple-system, sans-serif;
  }
  .screen-nav button:hover { background: var(--accent-soft); }

  .all-screens { display: flex; flex-direction: column; gap: 40px; }

  /* Checkbox */
  .checkbox {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .checkbox.done { background: var(--accent); border-color: var(--accent); }
  .checkbox.done::after { content: '✓'; color: #fff; font-size: 13px; font-weight: 700; }

  /* Sleep chip */
  .sleep-hint {
    background: #EDE7F6;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12px;
    color: #5E4B7A;
    margin-top: 12px;
    line-height: 1.5;
  }

  /* Progress card */
  .progress-row {
    display: flex;
    justify-content: space-around;
    text-align: center;
    padding: 8px 0;
  }
  .progress-item .p-val {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    font-family: Georgia, serif;
  }
  .progress-item .p-label { font-size: 11px; color: var(--text2); margin-top: 2px; }

  /* Week grid */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-top: 8px;
  }
  .week-cell {
    aspect-ratio: 1;
    border-radius: 6px;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
  }
  .week-cell.done { background: #7DA97C; color: #fff; }
  .week-cell.partial { background: #C9D5C4; color: #3D3929; }
  .week-cell.rest { background: #E8E4DB; color: #8B866E; }
  .week-cell.missed { background: #F5E0DD; color: #D4706A; }

  /* Exercise Detail Modal */
  .modal-overlay {
    position: fixed; top:0;left:0;right:0;bottom:0;
    background: rgba(61,57,41,0.5);
    z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .modal-sheet {
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    width: 390px; max-height: 80vh;
    overflow-y: auto;
    padding: 8px 20px 30px;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 8px auto 16px;
  }
  .modal-title {
    font-size: 20px; font-weight: 700; color: var(--text);
    font-family: Georgia, "Songti SC", serif;
    margin-bottom: 4px;
  }
  .modal-category {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px; font-weight: 600;
    padding: 3px 10px; border-radius: 10px;
    margin-bottom: 16px;
  }
  .modal-illustration-lg {
    width: 100%; height: 140px;
    background: var(--accent-soft);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
  }
  .modal-illustration-lg svg {
    width: 120px; height: 120px;
  }
  .modal-section {
    margin-bottom: 16px;
  }
  .modal-section h4 {
    font-size: 14px; font-weight: 700; color: var(--text);
    margin-bottom: 6px;
    font-family: Georgia, "Songti SC", serif;
  }
  .modal-section .step {
    display: flex; gap: 10px; margin-bottom: 8px;
    font-size: 13px; color: var(--text); line-height: 1.5;
  }
  .modal-section .step-num {
    width: 20px; height: 20px;
    background: var(--accent); color: #fff;
    border-radius: 50%; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .tip-box {
    background: #FFF8E1; border-radius: 10px;
    padding: 12px 14px; font-size: 12px; color: #8B6F2A;
    line-height: 1.5; margin-bottom: 8px;
  }
  .tip-box strong { color: #C79100; }
  .mistake-box {
    background: #FFEBEE; border-radius: 10px;
    padding: 12px 14px; font-size: 12px; color: #A84840;
    line-height: 1.5; margin-bottom: 8px;
  }
  .mistake-box strong { color: #D4706A; }
  .modal-close {
    width: 100%; padding: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; font-size: 14px; font-weight: 600;
    color: var(--text); cursor: pointer;
    font-family: -apple-system, sans-serif;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="phone" id="phone">
  <!-- Status Bar -->
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋 85%</span>
  </div>

  <!-- All Screens Container -->
  <div class="screen" id="screen-container"></div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-item active" onclick="scrollToScreen('today')">
      <span class="nav-icon">📋</span> 今日
    </button>
    <button class="nav-item" onclick="scrollToScreen('week')">
      <span class="nav-icon">📅</span> 周计划
    </button>
    <button class="nav-item" onclick="scrollToScreen('diet')">
      <span class="nav-icon">🥗</span> 饮食
    </button>
    <button class="nav-item" onclick="scrollToScreen('progress')">
      <span class="nav-icon">📊</span> 进度
    </button>
    <button class="nav-item" onclick="scrollToScreen('settings')">
      <span class="nav-icon">⚙️</span> 设置
    </button>
  </div>

  <!-- Exercise Detail Modal (hidden by default) -->
  <div id="exercise-modal" style="display:none" onclick="if(event.target===this)closeModal()">
    <div class="modal-sheet" id="modal-content"></div>
  </div>
</div>

<script>

// === MODAL LOGIC ===
function openExercise(exerciseId) {
  const ex = EXERCISES[exerciseId];
  if (!ex) return;

  const modal = document.getElementById('exercise-modal');
  const content = document.getElementById('modal-content');

  content.innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">${ex.name}</div>
    <span class="modal-category">${ex.category}</span>

    <div class="modal-illustration-lg">${ex.svg}</div>

    <div class="modal-section">
      <h4>📋 动作步骤</h4>
      ${ex.steps.map((s, i) => `
        <div class="step">
          <span class="step-num">${i + 1}</span>
          <span>${s}</span>
        </div>
      `).join('')}
    </div>

    <div class="modal-section">
      <h4>🔑 关键要点</h4>
      <div class="tip-box">${ex.tips}</div>
    </div>

    <div class="modal-section">
      <h4>🚫 常见错误</h4>
      <div class="mistake-box">${ex.mistakes}</div>
    </div>

    <div class="modal-section">
      <h4>🫁 呼吸节奏</h4>
      <div style="font-size:13px;color:var(--text);line-height:1.5">${ex.breathing}</div>
    </div>

    <div class="modal-section">
      <h4>📊 训练参数</h4>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span style="background:var(--bg);padding:6px 12px;border-radius:8px;font-size:13px;font-family:'SF Mono',Menlo,monospace;color:var(--text)">${ex.sets}</span>
        <span style="background:var(--bg);padding:6px 12px;border-radius:8px;font-size:13px;font-family:'SF Mono',Menlo,monospace;color:var(--text)">休息 ${ex.rest}</span>
      </div>
    </div>

    <div class="modal-section">
      <h4>🧠 为什么做这个动作</h4>
      <div style="font-size:13px;color:var(--text2);line-height:1.6">${ex.why}</div>
    </div>

    <button class="modal-close" onclick="closeModal()">关闭</button>
  `;

  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('exercise-modal').style.display = 'none';
  document.body.style.overflow = '';
}
</script>
